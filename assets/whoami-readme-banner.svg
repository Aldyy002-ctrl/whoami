<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="title desc">
  <title id="title">WhoAmI Portfolio</title>
  <desc id="desc">Dark portfolio banner with 999 branding and neon gradient accents.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090a0c"/>
      <stop offset="58%" stop-color="#0f1115"/>
      <stop offset="100%" stop-color="#12151b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff00ff"/>
      <stop offset="38%" stop-color="#56d6e7"/>
      <stop offset="70%" stop-color="#9b87ff"/>
      <stop offset="100%" stop-color="#c7ff4a"/>
    </linearGradient>
    <radialGradient id="glowA" cx="78%" cy="24%" r="58%">
      <stop offset="0%" stop-color="#9b87ff" stop-opacity=".20"/>
      <stop offset="100%" stop-color="#9b87ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="72%" cy="86%" r="50%">
      <stop offset="0%" stop-color="#56d6e7" stop-opacity=".12"/>
      <stop offset="100%" stop-color="#56d6e7" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" fill="none" stroke="#ffffff" stroke-opacity=".035"/>
    </pattern>
  </defs>

  <rect width="1280" height="420" rx="30" fill="url(#bg)"/>
  <rect width="1280" height="420" rx="30" fill="url(#glowA)"/>
  <rect width="1280" height="420" rx="30" fill="url(#glowB)"/>
  <rect width="1280" height="420" rx="30" fill="url(#grid)"/>

  <g transform="translate(900 72)">
    <circle cx="125" cy="132" r="110" fill="none" stroke="#ffffff" stroke-opacity=".07" stroke-width="2"/>
    <circle cx="125" cy="132" r="78" fill="none" stroke="#ffffff" stroke-opacity=".05" stroke-width="2"/>
    <rect x="22" y="38" width="206" height="188" rx="28" fill="#111317" stroke="#ffffff" stroke-opacity=".12"/>
    <rect x="48" y="64" width="154" height="136" rx="22" fill="#0b0d10" stroke="url(#accent)" stroke-width="2"/>
    <text x="125" y="151" text-anchor="middle" fill="url(#accent)" font-family="Georgia, serif" font-size="72" font-weight="700">999</text>
  </g>

  <g transform="translate(86 78)">
    <rect width="144" height="34" rx="17" fill="#ffffff" fill-opacity=".045" stroke="#ffffff" stroke-opacity=".10"/>
    <text x="72" y="23" text-anchor="middle" fill="#c7ff4a" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="800" letter-spacing="2">PORTFOLIO / 2026</text>

    <text x="0" y="127" fill="#eef0e8" font-family="Segoe UI, Arial, sans-serif" font-size="66" font-weight="800" letter-spacing="-2">Muhammad AldiAnsyah</text>
    <text x="2" y="176" fill="#9da39a" font-family="Segoe UI, Arial, sans-serif" font-size="24">Web Developer • Responsive Products • Interactive UI</text>

    <g transform="translate(0 226)">
      <rect width="126" height="42" rx="21" fill="#c7ff4a"/>
      <text x="63" y="28" text-anchor="middle" fill="#090a0c" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="800">NEXT.JS 16</text>

      <rect x="144" width="150" height="42" rx="21" fill="#9b87ff" fill-opacity=".12" stroke="#9b87ff" stroke-opacity=".30"/>
      <text x="219" y="28" text-anchor="middle" fill="#c9bdff" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">RESPONSIVE</text>

      <rect x="312" width="134" height="42" rx="21" fill="#56d6e7" fill-opacity=".10" stroke="#56d6e7" stroke-opacity=".26"/>
      <text x="379" y="28" text-anchor="middle" fill="#9cecf5" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">VERCEL</text>
    </g>
